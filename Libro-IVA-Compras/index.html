<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversor de TXT a Excel - FluXor</title>
  <link rel="stylesheet" href="style.css">
  <!-- Biblioteca XLSX.js para la generación de archivos Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.16.9/xlsx.full.min.js"></script>
  <!-- Biblioteca DataTables para visualización y edición de tablas -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>Conversor de TXT a Excel</h1>
    <p>Cargue los archivos TXT y conviértalos a Excel, CSV o JSON</p>

    <div class="upload-container">
      <div class="file-upload">
        <input type="file" id="comprasFile" accept=".txt" onchange="showFileStatus('comprasFileStatus')">
        <label for="comprasFile">Cargar Compras Comprobantes</label>
        <p id="comprasFileStatus" class="status-message"></p>
        <button id="processComprasButton">Generar Excel Compras</button>
      </div>

      <div class="file-upload">
        <input type="file" id="alicuotasFile" accept=".txt" onchange="showFileStatus('alicuotasFileStatus')">
        <label for="alicuotasFile">Cargar Compras Alícuotas</label>
        <p id="alicuotasFileStatus" class="status-message"></p>
        <button id="processAlicuotasButton">Generar Excel Alícuotas</button>
      </div>
    </div>

    <div id="result" class="result">
      <a id="comprasDownload" class="download-button" style="display: none;">Descargar Compras Correctas</a>
      <a id="alicuotasDownload" class="download-button" style="display: none;">Descargar Alícuotas Correctas</a>
      <a id="comprasErrorsDownload" class="download-button" style="display: none;">Descargar Errores en Compras</a>
      <a id="alicuotasErrorsDownload" class="download-button" style="display: none;">Descargar Errores en Alícuotas</a>
      <p id="resultMessage" class="status-message"></p>
    </div>

    <div id="table-container"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
